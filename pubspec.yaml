name: mobile
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: "^3.11.4"

dependencies:
  bloc: ^9.2.1
  cached_network_image: ^3.4.1
  dio: ^5.11.0
  equatable: ^2.1.0
  firebase_core: ^4.14.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_dotenv: ^5.2.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.17
  get_it: ^9.2.1
  go_router: ^14.8.1
  google_sign_in: ^7.2.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  shared_preferences: ^2.5.2
  shimmer: ^3.0.0
  sign_in_button: ^3.2.0
  supabase_flutter: ^2.17.2
  flutter_native_splash: ^2.4.4

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
    - assets/images/

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo.png
  android_12:
    image: assets/images/logo.png
    icon_background_color: "#FFFFFF"
