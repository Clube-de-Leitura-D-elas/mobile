name: Deploy to Stores (Fastlane)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Qual plataforma publicar?'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - android
          - ios
      android_track:
        description: 'Faixa do Android (Google Play)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - production
      bump_type:
        description: 'Tipo de incremento de versão no pubspec.yaml'
        required: true
        default: 'build_number'
        type: choice
        options:
          - build_number
          - patch
          - minor
          - major
          - none
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # ==========================================
  # PREPARAR & BUMP DE VERSÃO
  # ==========================================
  prepare-version:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      build_number: ${{ steps.bump.outputs.build_number }}
      version_name: ${{ steps.bump.outputs.version_name }}
      git_ref: ${{ steps.push.outputs.git_commit_sha || github.sha }}

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Incrementar Versão no pubspec.yaml
        id: bump
        run: |
          BUMP_TYPE="${{ github.event.inputs.bump_type || 'build_number' }}"
          python3 .github/scripts/bump_version.py "$BUMP_TYPE"

      - name: Commit e Push da Nova Versão
        id: push
        run: |
          NEW_VER="${{ steps.bump.outputs.new_version }}"
          if git diff --quiet pubspec.yaml; then
            echo "Nenhuma alteração de versão necessária."
            echo "git_commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore(release): bump version to $NEW_VER [skip ci]"
          git tag "v$NEW_VER"

          TARGET_BRANCH="${{ github.event.release.target_commitish || github.ref_name }}"
          if [[ "$TARGET_BRANCH" =~ ^v[0-9] ]]; then
            TARGET_BRANCH="${{ github.event.repository.default_branch || 'develop' }}"
          fi

          echo "Enviando commit e tags para a branch $TARGET_BRANCH..."
          git push origin HEAD:"$TARGET_BRANCH" --tags
          echo "git_commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ==========================================
  # ANDROID DEPLOY (Google Play)
  # ==========================================
  deploy-android:
    needs: [prepare-version]
    if: ${{ github.event.inputs.target == 'both' || github.event.inputs.target == 'android' || github.event_name == 'release' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.git_ref }}

      - name: Configurar Java / JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.50.0'
          cache: true

      - name: Configurar Ruby + Bundler (Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          working-directory: android
          bundler-cache: true

      - name: Criar arquivo .env
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          elif [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi

      - name: Decodificar Upload Keystore e criar key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > ${{ runner.temp }}/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=${KEY_ALIAS:-upload}
          storeFile=${{ runner.temp }}/upload-keystore.jks
          EOF

      - name: Instalar Dependências Flutter
        run: flutter pub get

      - name: Gerar Arquivos de Localização (ARB / l10n)
        run: flutter gen-l10n

      - name: Gerar App Bundle (.aab) Assinado
        run: flutter build appbundle --release

      - name: Criar JSON da Service Account do Google Play
        env:
          PLAY_STORE_CONFIG_JSON: ${{ secrets.PLAY_STORE_CONFIG_JSON }}
        run: |
          echo "$PLAY_STORE_CONFIG_JSON" > android/fastlane/play-store-credentials.json

      - name: Publicar no Google Play via Fastlane
        working-directory: android
        run: |
          TRACK="${{ github.event.inputs.android_track || 'internal' }}"
          bundle exec fastlane "$TRACK"

  # ==========================================
  # IOS DEPLOY (Apple TestFlight)
  # ==========================================
  deploy-ios:
    needs: [prepare-version]
    if: ${{ github.event.inputs.target == 'both' || github.event.inputs.target == 'ios' || github.event_name == 'release' }}
    runs-on: macos-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.git_ref }}

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.50.0'
          cache: true

      - name: Configurar Ruby + Bundler (Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          working-directory: ios
          bundler-cache: true

      - name: Criar arquivo .env
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          elif [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi

      - name: Instalar Certificado de Distribuição Apple no Keychain
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: "temp-ci-keychain-pass"
        run: |
          CERT_PATH=${{ runner.temp }}/build_certificate.p12
          KEYCHAIN_PATH=${{ runner.temp }}/app-signing.keychain-db

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $CERT_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH || true

      - name: Instalar Dependências Flutter e Preparar iOS
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
          flutter gen-l10n
          cd ios && pod install --repo-update

      - name: Compilar e Publicar no TestFlight via Fastlane
        working-directory: ios
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          bundle exec fastlane beta
