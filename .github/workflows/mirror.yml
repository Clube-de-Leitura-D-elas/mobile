name: Mirror to AGES GitLab - Clube de Leitura D'Elas Mobile

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-mirror-${{ github.repository }}
  cancel-in-progress: false

jobs:
  mirror:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GITLAB_REPOSITORY: tools.ages.pucrs.br/2026-2/3jk-5jk/clube-de-leitura-d-elas/mobile.git

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push changed ref to GitLab
        env:
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          : "${GITLAB_USERNAME:?Repository secret GITLAB_USERNAME is required}"
          : "${GITLAB_TOKEN:?Repository secret GITLAB_TOKEN is required}"

          gitlab_url="https://${GITLAB_USERNAME}:${GITLAB_TOKEN}@${GITLAB_REPOSITORY}"

          push_with_retry() {
            local attempt
            for attempt in 1 2 3; do
              if git push "${gitlab_url}" --force "$@"; then
                return 0
              fi
              if (( attempt == 3 )); then
                echo "GitLab push failed after ${attempt} attempts" >&2
                return 1
              fi
              echo "GitLab push failed (attempt ${attempt}/3); retrying in 20 seconds" >&2
              sleep 20
            done
          }

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            for branch in main develop; do
              if git show-ref --verify --quiet "refs/remotes/origin/${branch}"; then
                push_with_retry "refs/remotes/origin/${branch}:refs/heads/${branch}"
              fi
            done
            push_with_retry --tags
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            push_with_retry "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          else
            push_with_retry "refs/remotes/origin/${GITHUB_REF_NAME}:refs/heads/${GITHUB_REF_NAME}"
          fi

      - name: Notify Discord
        if: success() || failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${DISCORD_WEBHOOK_URL:-}" ]]; then
            echo "::warning::DISCORD_WEBHOOK_URL is not set; skipping Discord notification"
            exit 0
          fi

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          ref_info="Repositório: \`${GITHUB_REPOSITORY}\`
          Ref: \`${GITHUB_REF_NAME}\`
          Commit: \`${GITHUB_SHA:0:7}\` por ${GITHUB_ACTOR}"

          if [[ "${JOB_STATUS}" == "success" ]]; then
            text="✅ **Espelhamento para o GitLab concluído**
          ${ref_info}
          GitLab: https://${GITLAB_REPOSITORY%.git}/-/tree/${GITHUB_REF_NAME}"
          else
            text="❌ **Espelhamento para o GitLab falhou**
          ${ref_info}

          O código está no GitHub mas **não chegou ao GitLab**, que é onde a AGES avalia.
          Reexecutar o job: ${run_url}"
          fi

          jq -n --arg content "${text}" '{content: $content}' \
            | curl --silent --show-error --fail --max-time 30 \
                   -H "Content-Type: application/json" \
                   -d @- "${DISCORD_WEBHOOK_URL}" \
            || echo "::warning::Could not send Discord notification"
