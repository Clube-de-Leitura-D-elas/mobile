name: Flutter CI & Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests & Generate Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.50.0'
          cache: true

      - name: Create .env file
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE_CONTENT" ]; then
            printf '%s\n' "$ENV_FILE_CONTENT" > .env
          else
            cp .env.example .env
          fi

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run static analysis
        run: flutter analyze

      - name: Run tests with coverage
        # Fuso não UTC: os testes de data precisam de uma virada de dia entre
        # o horário local e o UTC (ver app_group_card_test.dart e
        # meeting_details_page_test.dart, que usam toLocal()).
        env:
          TZ: America/Sao_Paulo
        run: flutter test --coverage

      - name: Remove generated l10n files from coverage
        run: |
          dart pub global activate remove_from_coverage
          dart pub global run remove_from_coverage:remove_from_coverage -f coverage/lcov.info -r 'lib/l10n/'


      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
